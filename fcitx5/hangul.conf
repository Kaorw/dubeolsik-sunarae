# fcitx5-hangul config to select Dubeolsik Sun-arae.
#
# NOT USABLE YET: fcitx5-hangul's "Keyboard" setting is a fixed enum
# (see src/engine.h in the fcitx5-hangul source) that doesn't know
# about "2sunarae" until fcitx5-hangul itself is also patched - see
# ../docs/NEXT-STEPS.md and
# ../patches/0002-fcitx5-hangul-add-sunarae-option.patch.DRAFT.
# Installing the patched libhangul alone is not enough.
#
# Once that patch is applied, built, and installed, this is how you'd
# select it:
#   cp hangul.conf ~/.config/fcitx5/conf/hangul.conf
#   fcitx5 -r &   # or log out/in, or restart fcitx5 however Omarchy does it
Keyboard=Dubeolsik Sun-arae

# Rules 2.1/2.2/2.3 all work without this (the new keyboard calls the
# combination tables directly). Left at the fcitx5-hangul default; flip
# to True only if you also want ordinary/base dubeolsik-style double-
# stroke behavior for jamo this layout doesn't already cover.
# CombiOnDoubleStroke=False

# Defaults carried over from the stock config; adjust to taste.
# AutoReorder=True
# NonChoseongCombi=True
# WordCommit=False
# HanjaMode=False
