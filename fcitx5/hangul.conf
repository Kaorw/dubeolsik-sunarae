# Dubeolsik Sun-arae를 선택하는 fcitx5-hangul 설정.
#
# 패치된 두 패키지(../packaging/ 참고)가 모두 설치되어 있어야 합니다: libhangul("2sunarae" 키보드 추가)과 fcitx5-hangul (이 Keyboard 옵션 추가). 적용 방법:
#   cp hangul.conf ~/.config/fcitx5/conf/hangul.conf
#   fcitx5 -r &   # 또는 로그아웃/로그인, 혹은 Omarchy가 관리하는 방식으로 fcitx5 재시작
Keyboard=Dubeolsik Sun-arae

# 규칙 2.1/2.2/2.3은 이 옵션 없이도 모두 동작합니다(새 키보드가 조합 테이블을 직접 호출하기 때문). fcitx5-hangul 기본값을 그대로 두었으며, 이 자판이 아직 다루지 않는 자모에도 일반 두벌식 방식의 더블 스트로크 동작을 원할 때만 True로 바꾸세요.
# CombiOnDoubleStroke=False

# stock 설정에서 그대로 가져온 기본값. 취향에 맞게 조정하세요.
# AutoReorder=True
# NonChoseongCombi=True
# WordCommit=False
# HanjaMode=False
